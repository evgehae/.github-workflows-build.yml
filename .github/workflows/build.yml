name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: unpack
        run: |
          echo '' | base64 -d > torchbright.zip
          unzip -q torchbright.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - run: cd src && gradle assembleDebug --no-daemon
      - run: |
          mkdir out
          cp -r src/magisk/. out/
          cp src/app/build/outputs/apk/debug/app-debug.apk out/torchbright.apk
      - uses: actions/upload-artifact@v4
        with:
          name: torchbright-module
          path: out

